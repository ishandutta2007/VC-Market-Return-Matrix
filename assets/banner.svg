<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" opacity="0.8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.6; transform: scale(1.08); }
      100% { opacity: 0.3; transform: scale(1); }
    }
    @keyframes floatChart {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dashMove {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes barRise {
      0% { transform: scaleY(0.3); }
      50% { transform: scaleY(1.05); }
      100% { transform: scaleY(0.95); }
    }
    .glow-orb { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
    .floating-group { animation: floatChart 5s ease-in-out infinite; }
    .chart-line { stroke-dasharray: 600; animation: dashMove 4s ease-out forwards; }
    .bar-anim { transform-origin: bottom; animation: barRise 3s ease-out infinite alternate; }
    .title-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 800; fill: #ffffff; }
    .sub-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 500; fill: #94a3b8; }
    .badge-text { font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 600; font-size: 13px; fill: #e2e8f0; }
  </style>

  <!-- Base Canvas -->
  <rect width="1000" height="300" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Orbs (Background layer) -->
  <circle cx="150" cy="80" r="100" fill="#4f46e5" opacity="0.25" filter="url(#glow)" class="glow-orb" />
  <circle cx="850" cy="220" r="120" fill="#9333ea" opacity="0.2" filter="url(#glow)" class="glow-orb" />

  <!-- Background Grid Lines (Subtle) -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="60" x2="1000" y2="60" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="180" x2="1000" y2="180" />
    <line x1="0" y1="240" x2="1000" y2="240" />
    <line x1="200" y1="0" x2="200" y2="300" />
    <line x1="400" y1="0" x2="400" y2="300" />
    <line x1="600" y1="0" x2="600" y2="300" />
    <line x1="800" y1="0" x2="800" y2="300" />
  </g>

  <!-- Background Decorative Visual Elements (Right Side - Low Opacity so Title stays Foreground) -->
  <g class="floating-group" opacity="0.35">
    <!-- Mini Area Chart -->
    <path d="M 650,220 Q 720,160 780,180 T 900,110 L 900,240 L 650,240 Z" fill="url(#chartGrad)" />
    <path d="M 650,220 Q 720,160 780,180 T 900,110" fill="none" stroke="url(#lineGrad)" stroke-width="3" class="chart-line" />
    
    <!-- Animated Chart Nodes -->
    <circle cx="720" cy="172" r="5" fill="#38bdf8" />
    <circle cx="780" cy="180" r="5" fill="#818cf8" />
    <circle cx="900" cy="110" r="6" fill="#c084fc" filter="url(#glow)" />

    <!-- Financial Return Bars -->
    <rect x="670" y="190" width="14" height="50" rx="3" fill="#6366f1" opacity="0.6" class="bar-anim" />
    <rect x="695" y="170" width="14" height="70" rx="3" fill="#8b5cf6" opacity="0.7" class="bar-anim" style="animation-delay: 0.5s;" />
    <rect x="720" y="150" width="14" height="90" rx="3" fill="#ec4899" opacity="0.8" class="bar-anim" style="animation-delay: 1s;" />
  </g>

  <!-- FOREGROUND CONTENT (Always clearly visible & unobscured) -->

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1000" height="4" fill="url(#accentGrad)" />

  <!-- Icon Logo / Emblem -->
  <g transform="translate(60, 65)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" />
    <path d="M 14,38 L 24,24 L 34,30 L 42,16" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
    <polygon points="42,16 34,16 42,24" fill="#ec4899" />
  </g>

  <!-- Title & Subtitle -->
  <text x="134" y="98" class="title-text" font-size="38" letter-spacing="-0.5">VC-Market-Return-Matrix</text>
  <text x="134" y="132" class="sub-text" font-size="16">Audited LP Fund Performance (Net IRR &amp; TVPI) Across Global VC Hubs</text>

  <!-- Tag Pills / Badges in Foreground -->
  <g transform="translate(134, 168)">
    <!-- Pill 1: US -->
    <g transform="translate(0,0)">
      <rect width="130" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="#38bdf8" />
      <text x="28" y="21" class="badge-text">United States</text>
    </g>

    <!-- Pill 2: Europe & Israel -->
    <g transform="translate(142,0)">
      <rect width="145" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="#818cf8" />
      <text x="28" y="21" class="badge-text">Europe &amp; Israel</text>
    </g>

    <!-- Pill 3: China -->
    <g transform="translate(299,0)">
      <rect width="115" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="#c084fc" />
      <text x="28" y="21" class="badge-text">Greater Asia</text>
    </g>

    <!-- Pill 4: India & SEA -->
    <g transform="translate(426,0)">
      <rect width="140" height="32" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="16" cy="16" r="4" fill="#f472b6" />
      <text x="28" y="21" class="badge-text">India &amp; SE Asia</text>
    </g>
  </g>

  <!-- Bottom Accent / Source Tagline -->
  <text x="134" y="232" font-family="system-ui, sans-serif" font-size="13" fill="#64748b">
    Data Aggregated from UCOP, CalPERS, LACERA, LACERS &amp; SMRS LP Disclosures
  </text>
</svg>
