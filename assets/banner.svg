<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1000 300"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0b0f19"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#8b5cf6"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="chartGrad" x1="0%" x2="0%" y1="100%" y2="0%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".1"/><stop offset="100%" stop-color="#8b5cf6" stop-opacity=".6"/></linearGradient><linearGradient id="lineGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" opacity=".8" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="12"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes pulseGlow{0%{opacity:.3;transform:scale(1)}50%{opacity:.6;transform:scale(1.08)}}@keyframes floatChart{0%{transform:translateY(0)}50%{transform:translateY(-8px)}}@keyframes dashMove{0%{stroke-dashoffset:600}}@keyframes barRise{0%{transform:scaleY(.3)}50%{transform:scaleY(1.05)}}.glow-orb{animation:pulseGlow 6s ease-in-out infinite;transform-origin:center}.floating-group{animation:floatChart 5s ease-in-out infinite}.chart-line{stroke-dasharray:600;animation:dashMove 4s ease-out forwards}.bar-anim{transform-origin:bottom;animation:barRise 3s ease-out infinite alternate}.badge-text,.sub-text,.title-text{font-family:system-ui,-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,sans-serif}.title-text{font-weight:800;fill:#fff}.sub-text{font-weight:500;fill:#94a3b8}.badge-text{font-weight:600;font-size:13px;fill:#e2e8f0}</style><rect width="1000" height="300" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="100" fill="#4f46e5" class="glow-orb" filter="url(#glow)" opacity=".25"/><circle cx="850" cy="220" r="120" fill="#9333ea" class="glow-orb" filter="url(#glow)" opacity=".2"/><g stroke="#fff" stroke-opacity=".04" stroke-width="1"><line x1="0" x2="1000" y1="60" y2="60"/><line x1="0" x2="1000" y1="120" y2="120"/><line x1="0" x2="1000" y1="180" y2="180"/><line x1="0" x2="1000" y1="240" y2="240"/><line x1="200" x2="200" y1="0" y2="300"/><line x1="400" x2="400" y1="0" y2="300"/><line x1="600" x2="600" y1="0" y2="300"/><line x1="800" x2="800" y1="0" y2="300"/></g><g class="floating-group" opacity=".35"><path fill="url(#chartGrad)" d="M 650,220 Q 720,160 780,180 T 900,110 L 900,240 L 650,240 Z"/><path fill="none" stroke="url(#lineGrad)" stroke-width="3" d="M 650,220 Q 720,160 780,180 T 900,110" class="chart-line"/><circle cx="720" cy="172" r="5" fill="#38bdf8"/><circle cx="780" cy="180" r="5" fill="#818cf8"/><circle cx="900" cy="110" r="6" fill="#c084fc" filter="url(#glow)"/><rect width="14" height="50" x="670" y="190" fill="#6366f1" class="bar-anim" opacity=".6" rx="3"/><rect width="14" height="70" x="695" y="170" fill="#8b5cf6" class="bar-anim" opacity=".7" rx="3" style="animation-delay:.5s"/><rect width="14" height="90" x="720" y="150" fill="#ec4899" class="bar-anim" opacity=".8" rx="3" style="animation-delay:1s"/></g><rect width="1000" height="4" x="0" y="0" fill="url(#accentGrad)"/><g transform="translate(60, 65)"><rect width="56" height="56" x="0" y="0" fill="#1e1b4b" stroke="#6366f1" stroke-width="2" rx="14"/><path fill="none" stroke="url(#accentGrad)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4" d="M 14,38 L 24,24 L 34,30 L 42,16"/><polygon fill="#ec4899" points="42 16 34 16 42 24"/></g><text x="134" y="98" class="title-text" font-size="38" letter-spacing="-.5">VC-Market-Return-Matrix</text><text x="134" y="132" class="sub-text" font-size="16">Audited LP Fund Performance (Net IRR &amp; TVPI) Across Global VC Hubs</text><g><g transform="translate(134, 168) translate(0,0)"><rect width="130" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="16" cy="16" r="4" fill="#38bdf8"/><text x="28" y="21" class="badge-text">United States</text></g><g transform="translate(134, 168) translate(142,0)"><rect width="145" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="16" cy="16" r="4" fill="#818cf8"/><text x="28" y="21" class="badge-text">Europe &amp; Israel</text></g><g transform="translate(134, 168) translate(299,0)"><rect width="115" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="16" cy="16" r="4" fill="#c084fc"/><text x="28" y="21" class="badge-text">Greater Asia</text></g><g transform="translate(134, 168) translate(426,0)"><rect width="140" height="32" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="16"/><circle cx="16" cy="16" r="4" fill="#f472b6"/><text x="28" y="21" class="badge-text">India &amp; SE Asia</text></g></g><text x="134" y="232" fill="#64748b" font-family="system-ui, sans-serif" font-size="13">Data Aggregated from UCOP, CalPERS, LACERA, LACERS &amp; SMRS LP Disclosures</text></svg>